<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regression report</title>
<style>
:root { --text: #1f2328; --muted: #59636e; --border: #d1d9e0; --subtle: #f6f8fa; --grid: #eaeef2;
  --slower: #c93c37; --faster: #236aa4; --same: #9aa4ae; }
body { margin: 0; color: var(--text); font: 15px/1.6 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
main { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
h1, h2 { font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
h1 { font-size: 28px; margin: 0; }
h1 a { color: inherit; }
h2 { font-size: 20px; margin: 32px 0 12px; }
h3 { font-size: 16px; font-weight: 600; margin: 24px 0 4px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.slower { color: var(--slower); }
.faster { color: var(--faster); }

.appbar { position: sticky; top: 0; z-index: 1; background: #fff; border-bottom: 1px solid var(--border); }
.appbar .controls { max-width: 900px; margin: 0 auto; padding: 8px 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 12px 0; font-size: 13px; color: var(--muted); }
.controls label { display: flex; align-items: center; gap: 8px; }
.buttons { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.buttons button { font: inherit; color: var(--text); background: #fff; border: 0; padding: 3px 12px; cursor: pointer; }
.buttons button + button { border-left: 1px solid var(--border); }
.buttons button[aria-pressed="true"] { background: var(--subtle); font-weight: 600; }

.values { display: grid; grid-template-columns: repeat(6, 1fr); border: 1px solid var(--border); border-radius: 6px; }
.value { padding: 12px 14px; }
.value + .value { border-left: 1px solid var(--border); }
.value .title { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.value .number { font-size: 26px; font-weight: 600; white-space: nowrap; }
.value .sub { font-size: 13px; color: var(--muted); }
@media (max-width: 640px) {
  .values { grid-template-columns: 1fr 1fr; }
  .value:nth-child(odd) { border-left: 0; }
  .value:nth-child(n + 3) { border-top: 1px solid var(--border); }
}

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .03em;
  text-align: right; padding: 8px 12px; border-bottom: 1px solid var(--text); }
td { text-align: right; padding: 8px 12px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
td.change { font-weight: 600; }
.values, td { font-variant-numeric: tabular-nums; }

svg { display: block; width: 100%; }
svg text { font-size: 12px; fill: var(--muted); }
svg text.name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--text); }
svg text.folder { font-weight: 600; fill: var(--text); }
svg text.slower { fill: var(--slower); }
svg text.faster { fill: var(--faster); }
#tooltip { position: fixed; pointer-events: none; display: none; background: #fff; border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 8px; font-size: 13px; }
</style>
</head>
<body>
<div class="appbar"><div class="controls" id="controls"></div></div>
<main>
  <h1>Regression report for <a href="/*__PR_URL__*/">PR#/*__PR_NUMBER__*/</a></h1>
  <h2>Overview</h2>
  <div id="overview"></div>
  <h2>Benchmarks</h2>
  <div class="controls" id="filter"></div>
  <div id="chart"></div>
</main>
<div id="tooltip"></div>
<script type="text/csv" id="samples">/*__SAMPLES_CSV__*/</script>
<script>
const NOISE = 0.03, LIMIT = 0.10;
// The five ranges of the relative change, which together hold every benchmark.
// color: of its bars and dots; alert: its count is coloured too.
const RANGES = [
  { title: 'Regressions', sub: `≥ ${LIMIT * 100}% slowdown`, color: 'slower', alert: true, test: c => c >= LIMIT },
  { title: 'Slower', sub: `${NOISE * 100} to ${LIMIT * 100}% slowdown`, color: 'slower', test: c => c > NOISE },
  { title: 'Unchanged', sub: `within ±${NOISE * 100}%`, color: 'same', test: c => c >= -NOISE },
  { title: 'Faster', sub: `${NOISE * 100} to ${LIMIT * 100}% speedup`, color: 'faster', test: c => c > -LIMIT },
  { title: 'Improvements', sub: `≥ ${LIMIT * 100}% speedup`, color: 'faster', alert: true, test: () => true },
];
const rangeOf = change => RANGES.find(range => range.test(change));
// path: the selected folder, e.g. 'vss/delete'; '' shows everything.
const state = { threads: null, diff: 'relative', view: 'dots', path: '' };

const median = values => {
  const sorted = [...values].sort((a, b) => a - b), mid = sorted.length >> 1;
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
};
const geomean = values => Math.exp(values.reduce((sum, v) => sum + Math.log(v), 0) / values.length);
const sign = (v, zero) => v > zero ? '+' : v < -zero ? '−' : '';
const fmtTime = seconds => seconds >= 1 ? `${seconds.toFixed(2)} s` : `${(seconds * 1000).toFixed(1)} ms`;
const fmtPercent = change => `${sign(change, 0.0005)}${Math.abs(change * 100).toFixed(1)}%`;
const fmtDiff = seconds => `${sign(seconds, 0.00005)}${fmtTime(Math.abs(seconds))}`;
// The shown change of a benchmark, or of one run against the base median.
const relative = () => state.diff === 'relative';
const shown = (r, seconds = r.prMedian) => relative() ? seconds / r.baseMedian - 1 : seconds - r.baseMedian;
const fmtShown = v => relative() ? fmtPercent(v) : fmtDiff(v);

// One result per (threads, benchmark), from the CSV rows: benchmark, threads, side, run, seconds.
const results = new Map();
for (const line of document.getElementById('samples').textContent.trim().split('\n').slice(1)) {
  const [benchmark, threads, side, , seconds] = line.split(',');
  const name = benchmark.replace(/^benchmark\/|\.benchmark$/g, ''), key = `${threads}|${name}`;
  // path: the benchmark's folder below benchmark/, e.g. vss/insert.
  if (!results.has(key)) results.set(key, { threads: +threads, name, path: name.replace(/\/[^/]*$/, ''), base: [], pr: [] });
  results.get(key)[side].push(+seconds);
}
for (const r of results.values()) {
  r.baseMedian = median(r.base); r.prMedian = median(r.pr);
  r.change = r.prMedian / r.baseMedian - 1;
  r.range = rangeOf(r.change);
}
const threadCounts = [...new Set([...results.values()].map(r => r.threads))].sort((a, b) => a - b);
const folders = [...new Set([...results.values()].map(r => r.path))].sort();
state.threads = threadCounts[0];
const under = (path, prefix) => !prefix || path === prefix || path.startsWith(prefix + '/');

// A button group; a click sets state[key] to the button's value.
const buttons = (key, options, label = option => option) => `<span class="buttons">${options.map(option =>
  `<button data-key="${key}" data-value="${option}" aria-pressed="${String(state[key]) === String(option)}">${label(option)}</button>`).join('')}</span>`;

function renderOverview(rows) {
  const gmBase = geomean(rows.map(r => r.baseMedian)), gmPr = geomean(rows.map(r => r.prMedian));
  const gmRange = rangeOf(gmPr / gmBase - 1);
  const value = (title, number, sub, color) =>
    `<div class="value"><div class="title">${title}</div><div class="number ${color}">${number}</div><div class="sub">${sub}</div></div>`;
  const changed = rows.filter(r => r.range.color !== 'same').sort((a, b) => b.change - a.change);
  document.getElementById('overview').innerHTML = `<div class="values">
    ${value('Geomean change', relative() ? fmtPercent(gmPr / gmBase - 1) : fmtDiff(gmPr - gmBase),
      `${fmtTime(gmBase)} → ${fmtTime(gmPr)}`, gmRange.alert ? gmRange.color : '')}
    ${RANGES.map(range => {
      const n = rows.filter(r => r.range === range).length;
      return value(range.title, n, range.sub, n && range.alert ? range.color : '');
    }).join('')}
    </div>
    ${changed.length ? `<h3>Outside ±${NOISE * 100}%</h3><table>
      <tr><th>Benchmark</th><th>Base</th><th>PR</th><th>Change</th></tr>
      ${changed.map(r => `<tr><td class="mono">${r.name}</td><td>${fmtTime(r.baseMedian)}</td><td>${fmtTime(r.prMedian)}</td>
        <td class="change ${r.range.color}">${fmtShown(shown(r))}</td></tr>`).join('')}
    </table>` : ''}`;
}

// One row of buttons per level of the selected path, plus one for the level below it.
function renderFilter() {
  const selected = state.path ? state.path.split('/') : [];
  const rows = [];
  for (let depth = 0; depth <= selected.length; depth++) {
    const prefix = selected.slice(0, depth).join('/');
    const below = folders.filter(folder => under(folder, prefix) && folder !== prefix);
    if (!below.length) break;
    const children = [...new Set(below.map(folder => folder.split('/')[depth]))];
    const options = ['', ...children].map(child => [prefix, child].filter(Boolean).join('/'));
    const pressed = selected.slice(0, depth + 1).join('/');
    rows.push(`<label>Folder <span class="buttons">${options.map(option =>
      `<button data-key="path" data-value="${option}" aria-pressed="${option === pressed}">${option === prefix ? 'All'
        : option.split('/').pop() + '/'}</button>`).join('')}</span></label>`);
  }
  document.getElementById('filter').innerHTML = rows.join('');
}

// One row per benchmark, grouped by folder, on a shared axis: a bar for the median change, or a dot per run.
function renderChart(rows) {
  const dots = state.view === 'dots';
  const extent = rows.flatMap(r => dots ? [...r.base, ...r.pr].map(s => Math.abs(shown(r, s))) : [Math.abs(shown(r))]);
  const limit = Math.max(relative() ? LIMIT * 1.2 : 1e-6, ...extent) * 1.1;
  const W = 900, left = 190, right = 60, top = 22, rowH = 30;
  const x = v => left + (W - left - right) * (v + limit) / (2 * limit);
  const circles = (r, runs, y, color) => runs.map(s => `<circle cx="${x(shown(r, s))}" cy="${y}" r="3" fill="var(--${color})" fill-opacity=".6"/>`).join('');
  let y = top, marks = '';
  for (const folder of folders.filter(folder => under(folder, state.path))) {
    marks += `<text class="folder" y="${y + 18}">${folder}/</text>`;
    y += rowH;
    for (const r of rows.filter(r => r.path === folder)) {
      const end = x(shown(r)), color = r.range.color;
      marks += `<g data-tip="${r.name}: ${fmtTime(r.baseMedian)} → ${fmtTime(r.prMedian)}">
        <rect width="${W}" y="${y}" height="${rowH}" fill="transparent"/>
        <text class="name" y="${y + 19}">${r.name}</text>
        ${dots ? `${circles(r, r.base, y + 10, 'same')}${circles(r, r.pr, y + 21, color === 'same' ? 'text' : color)}
          <line x1="${end}" x2="${end}" y1="${y + 15}" y2="${y + 27}" stroke="var(--text)" stroke-width="2"/>`
        : `<rect x="${Math.min(x(0), end)}" y="${y + 9}" width="${Math.max(Math.abs(end - x(0)), 1)}" height="12" fill="var(--${color})"/>`}
        <text x="${W}" y="${y + 19}" text-anchor="end" class="${color}">${fmtShown(shown(r))}</text></g>`;
      y += rowH;
    }
  }
  // Gridlines every 1, 2 or 5 times a power of ten.
  const power = 10 ** Math.floor(Math.log10(limit / 2)), ratio = limit / 2 / power;
  const step = power * (ratio >= 5 ? 5 : ratio >= 2 ? 2 : 1), ticks = [];
  for (let i = -Math.floor(limit / step); i * step <= limit; i++) ticks.push(i * step);
  const vertical = (v, stroke, dash = '') => `<line x1="${x(v)}" x2="${x(v)}" y1="${top - 6}" y2="${y}" stroke="var(--${stroke})" stroke-dasharray="${dash}"/>`;
  const axis = ticks.map(t => vertical(t, t ? 'grid' : 'muted') +
    `<text x="${x(t)}" y="${top - 10}" text-anchor="middle">${t ? fmtShown(t) : '0'}</text>`).join('');
  const limits = relative() ? vertical(LIMIT, 'slower', '3 3') + vertical(-LIMIT, 'faster', '3 3') : '';
  document.getElementById('chart').innerHTML = `<svg viewBox="0 0 ${W} ${y}">${axis}${limits}${marks}</svg>`;
}

function render() {
  document.getElementById('controls').innerHTML = `
    <label>Threads ${buttons('threads', threadCounts)}</label>
    <label>Change ${buttons('diff', ['relative', 'absolute'])}</label>
    <label>Show ${buttons('view', ['bars', 'dots'], view => view === 'bars' ? 'median' : 'every run')}</label>`;
  const rows = [...results.values()].filter(r => r.threads === state.threads);
  renderOverview(rows);
  renderFilter();
  renderChart(rows.filter(r => under(r.path, state.path)));
}

document.addEventListener('click', event => {
  const button = event.target.closest('[data-key]');
  if (!button) return;
  const { key, value } = button.dataset;
  state[key] = key === 'threads' ? +value : value;
  render();
});

const tooltip = document.getElementById('tooltip');
document.addEventListener('mousemove', event => {
  const target = event.target.closest('[data-tip]');
  tooltip.style.display = target ? 'block' : 'none';
  if (!target) return;
  tooltip.textContent = target.dataset.tip;
  tooltip.style.left = `${Math.min(event.clientX + 14, innerWidth - tooltip.offsetWidth - 8)}px`;
  tooltip.style.top = `${event.clientY + 16}px`;
});

render();
</script>
</body>
</html>
