#
# Compares the benchmarks of the PR's extension with the base branch's, with DuckDB's regression runner. Called by the
# main distribution pipeline after it built the extension: the artifacts of one workflow run are only shared within it.
#
name: Regression Test
on:
  workflow_call:

jobs:
  # DuckDB's benchmark runner has no DuckIR code: it loads duckir.duckdb_extension, so the base and the PR share it.
  benchmark-runner:
    name: Build benchmark runner
    runs-on: ubuntu-latest
    outputs:
      run_regression: ${{ steps.changes.outputs.run_regression }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The regression runs when the PR changes code or benchmarks, and pins the same DuckDB as its base: the base's
      # extension does not load into another DuckDB version.
      - name: Detect changes
        id: changes
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          run_regression=false
          if git diff --name-only "${BASE_REF}...HEAD" |
            grep -qE '^(src/|benchmark/|\.github/regression/|CMakeLists\.txt$|extension_config\.cmake$|vcpkg\.json$)' &&
            [ "$(git rev-parse HEAD:duckdb)" = "$(git rev-parse "${BASE_REF}:duckdb")" ]; then
            run_regression=true
          fi
          echo "run_regression=${run_regression}" >> "$GITHUB_OUTPUT"
          echo "duckdb_commit=$(git rev-parse HEAD:duckdb)" >> "$GITHUB_OUTPUT"

      - name: Restore benchmark runner
        id: cache
        if: steps.changes.outputs.run_regression == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmark_runner
          key: benchmark-runner-linux_amd64-${{ steps.changes.outputs.duckdb_commit }}

      - name: Build benchmark runner
        if: steps.changes.outputs.run_regression == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y ninja-build
          git submodule update --init duckdb
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=1 \
            -DOVERRIDE_GIT_DESCRIBE="$(git -C duckdb describe --tags)" -S duckdb -B build/runner
          cmake --build build/runner --target benchmark_runner
          cp build/runner/benchmark/benchmark_runner benchmark_runner

      # The benchmarks read SIFT1M from benchmark/data/; the regression jobs restore it from this cache.
      - name: Restore SIFT1M
        id: sift1m
        if: steps.changes.outputs.run_regression == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmark/data
          key: sift1m-${{ hashFiles('benchmark/vss/prepare_sift1m.py', 'benchmark/vss/config.benchmark.in') }}

      - name: Prepare SIFT1M
        if: steps.changes.outputs.run_regression == 'true' && steps.sift1m.outputs.cache-hit != 'true'
        run: |
          pip install numpy pyarrow h5py
          python3 benchmark/vss/prepare_sift1m.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.changes.outputs.run_regression == 'true'
        with:
          name: benchmark-runner
          path: benchmark_runner
          if-no-files-found: error

  # One job per benchmark: .github/regression/<benchmark>.csv lists its benchmark/vss/<benchmark>_<quantization> files.
  regression:
    name: ${{ matrix.benchmark }}
    needs: benchmark-runner
    if: needs.benchmark-runner.outputs.run_regression == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        benchmark: [create_index, sync_insert, delete, sync_update, search]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: benchmark-runner
          path: artifacts/runner

      - name: Restore SIFT1M
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmark/data
          key: sift1m-${{ hashFiles('benchmark/vss/prepare_sift1m.py', 'benchmark/vss/config.benchmark.in') }}
          fail-on-cache-miss: true

      - name: Download the PR's extension
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: duckir-*-extension-linux_amd64
          path: artifacts/pr

      - name: Download the base's extension
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          # A push or a manual dispatch on the base branch, never a PR run whose head branch has the same name.
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow MainDistributionPipeline.yml \
            --branch "$BASE_BRANCH" --status success --limit 20 --json databaseId,event \
            --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].databaseId')"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'duckir-*-extension-linux_amd64' \
            --dir artifacts/base

      # The layout test_runner.py expects: the extension in the repository directory next to each runner.
      - name: Lay out the base and the PR
        run: |
          chmod +x artifacts/runner/benchmark_runner
          for side in base pr; do
            mkdir -p "build/$side/release/benchmark" "build/$side/release/repository/duckdb/linux_amd64"
            cp artifacts/runner/benchmark_runner "build/$side/release/benchmark/"
            cp "$(find "artifacts/$side" -name duckir.duckdb_extension)" \
              "build/$side/release/repository/duckdb/linux_amd64/"
          done

      - name: Run regression benchmarks single-threaded
        run: |
          python3 duckdb/scripts/regression/test_runner.py \
            --old build/base/release/benchmark/benchmark_runner \
            --new build/pr/release/benchmark/benchmark_runner \
            --benchmarks ".github/regression/${{ matrix.benchmark }}.csv" \
            --threads 1 \
            --disable-timeout --verbose

      # ubuntu-latest has 4 cores.
      - name: Run regression benchmarks multi-threaded
        if: ${{ !cancelled() }}
        run: |
          python3 duckdb/scripts/regression/test_runner.py \
            --old build/base/release/benchmark/benchmark_runner \
            --new build/pr/release/benchmark/benchmark_runner \
            --benchmarks ".github/regression/${{ matrix.benchmark }}.csv" \
            --threads 4 \
            --disable-timeout --verbose
