#
# Compares the benchmarks of the PR's extension with the base branch's, with DuckDB's regression runner. Called by the
# main distribution pipeline after it built the extension and RegressionPrepare.yml built the benchmark runner: the
# artifacts of one workflow run are only shared within it.
#
name: Regression Test
on:
  workflow_call:

jobs:
  # One job per benchmark: .github/regression/<benchmark>.csv lists its benchmark/vss/<benchmark>_<quantization> files.
  regression:
    name: ${{ matrix.benchmark }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        benchmark: [create_index, sync_insert, delete, sync_update, search]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: benchmark-runner
          path: artifacts/runner

      - name: Restore SIFT1M
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmark/data
          key: sift1m-${{ hashFiles('benchmark/vss/prepare_sift1m.py', '.github/settings.env') }}
          fail-on-cache-miss: true

      - name: Download the PR's extension
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: duckir-*-extension-linux_amd64
          path: artifacts/pr

      - name: Download the base's extension
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          # A push or a manual dispatch on the base branch, never a PR run whose head branch has the same name.
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow MainDistributionPipeline.yml \
            --branch "$BASE_BRANCH" --status success --limit 20 --json databaseId,event \
            --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].databaseId')"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'duckir-*-extension-linux_amd64' \
            --dir artifacts/base

      # The layout test_runner.py expects: the extension in the repository directory next to each runner.
      - name: Lay out the base and the PR
        run: |
          chmod +x artifacts/runner/benchmark_runner
          for side in base pr; do
            mkdir -p "build/$side/release/benchmark" "build/$side/release/repository/duckdb/linux_amd64"
            cp artifacts/runner/benchmark_runner "build/$side/release/benchmark/"
            cp "$(find "artifacts/$side" -name duckir.duckdb_extension)" \
              "build/$side/release/repository/duckdb/linux_amd64/"
          done

      - name: Run regression benchmarks single-threaded
        run: |
          python3 duckdb/scripts/regression/test_runner.py \
            --old build/base/release/benchmark/benchmark_runner \
            --new build/pr/release/benchmark/benchmark_runner \
            --benchmarks ".github/regression/${{ matrix.benchmark }}.csv" \
            --threads 1 \
            --disable-timeout --verbose

      - name: Run regression benchmarks multi-threaded
        if: ${{ !cancelled() }}
        run: |
          python3 duckdb/scripts/regression/test_runner.py \
            --old build/base/release/benchmark/benchmark_runner \
            --new build/pr/release/benchmark/benchmark_runner \
            --benchmarks ".github/regression/${{ matrix.benchmark }}.csv" \
            --threads "$(grep '^REGRESSION_MICRO_N_THREADS=' .github/settings.env | cut -d= -f2)" \
            --disable-timeout --verbose
